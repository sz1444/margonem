<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Heros Helper - Groli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* Domyślnie jasny; klasa light-theme (historyczna nazwa, zapisana w localStorage) = ciemny. */
        :root {
            --dc-green: #1f9d55;
            --dc-yellow: #d99a1e;
            --dc-red: #e0393e;
            --dc-blurple: #2ecc71;
            --dc-accent-text: #0b2a17;
            --dc-bg-main: #ffffff;
            --dc-bg-side: #f3f4f6;
            --dc-bg-header: #eceef1;
            --dc-text-normal: #1f2328;
            --dc-text-muted: #6b7280;
            --dc-card-hover: rgba(0, 0, 0, 0.035);
            --dc-border: rgba(0, 0, 0, 0.08);
            --dc-chip-bg: #eef0f3;
            --dc-separator: rgba(0, 0, 0, 0.08);
            --shadow-main: 0 1px 2px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.06);
            --page-glow: radial-gradient(1200px 500px at 50% -200px, rgba(46, 204, 113, 0.10), transparent 70%);
        }
        body.light-theme {
            --dc-green: #2ecc71;
            --dc-yellow: #f0b232;
            --dc-red: #f2545b;
            --dc-blurple: #2ecc71;
            --dc-accent-text: #06170d;
            --dc-bg-main: #131519;
            --dc-bg-side: #0e1013;
            --dc-bg-header: #0a0b0d;
            --dc-text-normal: #e4e6ea;
            --dc-text-muted: #8a8f98;
            --dc-card-hover: rgba(255, 255, 255, 0.035);
            --dc-border: rgba(255, 255, 255, 0.07);
            --dc-chip-bg: #1b1e23;
            --dc-separator: rgba(255, 255, 255, 0.06);
            --shadow-main: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 10px 30px rgba(0, 0, 0, 0.45);
            --page-glow: radial-gradient(1200px 500px at 50% -200px, rgba(46, 204, 113, 0.12), transparent 70%);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--page-glow), var(--dc-bg-header);
            color: var(--dc-text-normal);
            margin: 0;
            overflow: hidden;
            transition: background-color 0.2s ease, color 0.2s ease;
            -webkit-font-smoothing: antialiased;
        }

        .dc-scroll { scrollbar-width: thin; scrollbar-color: var(--dc-border) transparent; }
        .dc-scroll::-webkit-scrollbar { width: 5px; }
        .dc-scroll::-webkit-scrollbar-track { background: transparent; }
        .dc-scroll::-webkit-scrollbar-thumb { background: var(--dc-border); border-radius: 10px; }
        .dc-scroll::-webkit-scrollbar-thumb:hover { background: var(--dc-blurple); }

        /* --- nagłówek --- */
        .dc-header {
            min-height: 56px;
            background-color: color-mix(in srgb, var(--dc-bg-main) 85%, transparent);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--dc-border);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .brand-mark {
            width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
            background: linear-gradient(135deg, #2ecc71, #1a8f4c);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 14px rgba(46, 204, 113, 0.35);
        }
        .brand-mark .material-icons { color: #fff; font-size: 17px; }
        #header-title { font-size: 13px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .dc-switch-wrap {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 10px; border-radius: 999px;
            background: var(--dc-bg-side); border: 1px solid var(--dc-border);
            cursor: pointer; user-select: none;
        }
        .dc-switch-wrap span.switch-label { font-size: 11px; font-weight: 600; color: var(--dc-text-muted); white-space: nowrap; }
        .dc-switch { position: relative; width: 28px; height: 16px; flex-shrink: 0; }
        .dc-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: var(--dc-border); transition: .2s; border-radius: 20px; }
        body:not(.light-theme) .slider { background-color: #cfd3d9; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: white; transition: .2s; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
        input:checked + .slider { background-color: var(--dc-blurple) !important; }
        input:checked + .slider:before { transform: translateX(12px); }

        .net-status {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 10px; border-radius: 999px;
            background: var(--dc-bg-side); border: 1px solid var(--dc-border);
        }
        #status-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 800; letter-spacing: 0.06em; }
        #status-indicator::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }

        #theme-toggle {
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 999px;
            background: var(--dc-bg-side); border: 1px solid var(--dc-border);
            color: var(--dc-text-muted); transition: color 0.2s, border-color 0.2s;
        }
        #theme-toggle:hover { color: var(--dc-text-normal); border-color: var(--dc-blurple); }

        /* --- kolumny --- */
        .dc-column {
            background-color: var(--dc-bg-main);
            border: 1px solid var(--dc-border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-main);
            min-height: 0;
        }
        .category-header {
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.01em;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--dc-text-normal);
            border-bottom: 1px solid var(--dc-border);
            background: linear-gradient(180deg, var(--dc-card-hover), transparent);
        }
        .category-header img.h-12 { filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); }
        .item-legends {
            background: #92471A;
            border: 1px solid #b4652c;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 0 3px 3px #000000a7;
        }

        .location-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 10px;
            margin: 2px 4px;
            border-radius: 8px;
            cursor: default;
            transition: background 0.12s ease;
            color: var(--dc-text-normal);
        }
        .location-item:hover { background-color: var(--dc-card-hover); }

        .time-label {
            font-size: 10px;
            font-weight: 700;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            min-width: 52px;
            padding: 2px 6px !important;
            text-align: center;
            white-space: nowrap;
            border-radius: 6px !important;
            background-color: var(--dc-chip-bg);
            border: 1px solid var(--dc-border);
        }
        .row-fresh .time-label { background-color: color-mix(in srgb, var(--dc-green) 14%, transparent); border-color: color-mix(in srgb, var(--dc-green) 35%, transparent); }
        .row-warning .time-label { background-color: color-mix(in srgb, var(--dc-yellow) 14%, transparent); border-color: color-mix(in srgb, var(--dc-yellow) 35%, transparent); }
        .row-danger .time-label { background-color: color-mix(in srgb, var(--dc-red) 10%, transparent); border-color: color-mix(in srgb, var(--dc-red) 25%, transparent); }

        .row-fresh { color: var(--dc-text-normal) !important; font-weight: 600; }
        .row-warning { color: var(--dc-text-normal) !important; }
        .row-danger { color: var(--dc-text-muted) !important; }

        .dc-chip {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            letter-spacing: -0.2px;
            border-radius: 999px;
            background-color: var(--dc-chip-bg);
            border: 1px solid var(--dc-border);
            color: var(--dc-text-muted);
            min-width: 56px;
            text-align: center;
            transition: background-color .15s, color .15s;
        }
        .dc-chip.active {
            background-color: var(--dc-blurple);
            color: var(--dc-accent-text);
            border-color: transparent;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.35);
        }

        .group-separator {
            height: 1px;
            background-color: var(--dc-separator);
            margin: 8px 14px;
            border: none;
        }
        .hide-row { display: none !important; }

        /* --- logowanie --- */
        #login-screen { background: radial-gradient(800px 400px at 50% 30%, rgba(46, 204, 113, 0.15), transparent 70%), #08090b; }
        .login-card {
            background: #131519; border: 1px solid rgba(255,255,255,0.07);
            border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        #dc-login-btn { background: #5865f2; border-radius: 10px; }
        #dc-login-btn:hover { background: #4752c4; }

        footer #footer-text { color: var(--dc-text-muted); opacity: .7; }

        /* --- mobile: kolumny jedna pod drugą, przewijana cała strona --- */
        @media (max-width: 1023px) {
            body { overflow: auto; height: auto !important; min-height: 100vh; }
            main { overflow: visible !important; }
            #main-grid { height: auto !important; }
            .dc-column { max-height: 75vh; }
        }
        @media (max-width: 640px) {
            .dc-header { padding: 8px 12px; }
            .header-tools { width: 100%; justify-content: space-between; }
            .dc-switch-wrap { padding: 5px 8px; }
            .dc-switch-wrap span.switch-label { font-size: 10px; }
            .category-header { font-size: 13px; }
            .category-header img.h-12 { height: 36px; }
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center hidden">
        <div class="login-card p-10 max-w-sm w-full mx-4 text-center">
            <div class="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6" style="background: linear-gradient(135deg, #2ecc71, #1a8f4c); box-shadow: 0 8px 24px rgba(46,204,113,.35);">
                <span class="material-icons text-white text-3xl">shield</span>
            </div>
            <h1 class="text-xl font-bold text-white mb-2">Zaloguj się</h1>
            <p class="text-[#8a8f98] text-sm mb-8">Połącz konto Discord, żeby zobaczyć obstawione mapy.</p>
            <button id="dc-login-btn" class="w-full text-white font-bold py-3 transition-colors text-sm tracking-wide">
                Zaloguj przez Discord
            </button>
        </div>
    </div>
    <header class="dc-header shrink-0">
        <div class="brand">
            <div class="brand-mark"><span class="material-icons">explore</span></div>
            <h1 id="header-title">Event Heros Helper</h1>
        </div>
        <div class="header-tools">
            <label class="dc-switch-wrap">
                <span class="dc-switch">
                    <input type="checkbox" id="global-filter">
                    <span class="slider"></span>
                </span>
                <span class="switch-label">Tylko wolne respy</span>
            </label>
            <label class="dc-switch-wrap">
                <span class="dc-switch">
                    <input type="checkbox" id="sort-toggle">
                    <span class="slider"></span>
                </span>
                <span class="switch-label">Sortuj po czasie</span>
            </label>
            <div class="net-status" title="Status połączenia">
                <span id="status-indicator" class="text-[10px] font-bold text-[#23a559]">POŁĄCZONY</span>
            </div>
            <div id="theme-toggle" title="Przełącz motyw">
                <span class="material-icons text-lg" id="theme-icon">dark_mode</span>
            </div>
        </div>
    </header>
    <main class="flex-grow p-3 overflow-hidden bg-transparent">
        <div id="main-grid" class="grid grid-cols-1 lg:grid-cols-3 h-full gap-3"></div>
    </main>
    <footer class="py-3 text-center">
        <span id="footer-text" class="text-[9px] font-bold uppercase tracking-widest">2026 &copy; By Groli</span>
    </footer>
    <script>
        const BACKEND_URL = "https://margone-api-2.onrender.com";
        const CLIENT_ID = "1488794373775687782";
        const REDIRECT_URI = encodeURIComponent(window.location.origin + window.location.pathname);
        const DISCORD_AUTH_URL = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=identify%20guilds.members.read`;
        let discordToken = localStorage.getItem('mapSync_dcToken');
        let cachedData = {};
        let socket = null;
        let sections = []; 
        async function init() {
            initTheme();
            checkUrlForToken();
            try {
                const response = await fetch('https://margonem.vercel.app/data.json');
                const config = await response.json();
                sections = config.columns;
                document.getElementById('header-title').innerText = config.event_metadata.title;
                document.getElementById('footer-text').innerHTML = config.event_metadata.footer;
                renderStructure(config.columns);
            } catch (error) { console.error(error); }
            if (!discordToken) {
                showLogin();
            }   
            initSocket();
            setInterval(updateTimers, 1000);
            document.getElementById('theme-toggle').onclick = toggleTheme;
            const filterEl = document.getElementById('global-filter');
            const sortEl = document.getElementById('sort-toggle');
            const urlParams = new URLSearchParams(window.location.search);
            filterEl.checked = urlParams.get('filter') === 'true';
            sortEl.checked = urlParams.get('sort') === 'true';
            const handleToggle = () => {
                const url = new URL(window.location);
                filterEl.checked ? url.searchParams.set('filter', 'true') : url.searchParams.delete('filter');
                sortEl.checked ? url.searchParams.set('sort', 'true') : url.searchParams.delete('sort');
                window.history.replaceState({}, '', url);
                if (!filterEl.checked && !sortEl.checked) { 
                    renderStructure(sections); 
                } else {
                    updateTimers();
                }
            };
            filterEl.onchange = handleToggle;
            sortEl.onchange = handleToggle;
            if(filterEl.checked || sortEl.checked) updateTimers();
        }
        function showLogin() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('dc-login-btn').onclick = () => { window.location.href = DISCORD_AUTH_URL; };
        }
        function renderStructure(columns) {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = "";
            columns.forEach(col => {
                const columnDiv = document.createElement('div');
                columnDiv.className = "dc-column";
                let itemsHtml = col.items.map(item => `
                    <div class="relative flex-shrink-0 group item-legends">
                        <div class="border border-[#999] text-md absolute bottom-0 right-0 z-10 px-[2px] py-0 text-[8px] font-bold uppercase rounded-[3px] bg-[#00000054] text-white pointer-events-none">${item.count}</div>
                        <img class="w-8 h-8" src="${item.img}">
                    </div>
                `).join('');
                columnDiv.innerHTML = `
                    <div class="category-header flex justify-between items-center">
                        <span class="flex-shrink-0 flex items-center gap-2">
                            <img class="h-12" src="${col.boss_gif}">
                            ${col.boss_name}
                        </span>
                        <div class="flex gap-1">${itemsHtml}</div>
                    </div>
                    <div id="grid-${col.id}" class="flex-grow overflow-y-auto dc-scroll px-1 pb-4"></div>
                `;
                grid.appendChild(columnDiv);
                renderMapsInColumn(col);
            });
        }
        function renderMapsInColumn(col) {
            const gridContainer = document.getElementById(`grid-${col.id}`);
            let lastColor = null;
            col.maps.forEach((mapData, i) => {
                const idBase = `${col.id}${i}`;
                if (lastColor && lastColor !== mapData[1]) {
                    const sep = document.createElement('hr');
                    sep.className = "group-separator";
                    gridContainer.appendChild(sep);
                }
                lastColor = mapData[1];
                const row = document.createElement('div');
                row.id = `row-${idBase}`;
                row.className = "location-item";
                row.dataset.originalIndex = i; 
                row.innerHTML = `
                    <div class="flex items-center flex-grow gap-2 min-w-0 mr-2">
                        <span id="timer-${idBase}_1-${idBase}_2" class="time-label rounded-[3px] px-2 text-[10px] text-[#4e5058]">BRAK</span>
                        <span class="text-[12px] font-normal truncate tracking-tighter">${mapData[0]}</span>
                    </div>
                    <div class="flex gap-1 shrink-0">
                        <div id="cell-${idBase}_1" class="dc-chip">---</div>
                        <div id="cell-${idBase}_2" class="dc-chip">---</div>
                    </div>
                `;
                gridContainer.appendChild(row);
                updateCellInUI(`${idBase}_1`, cachedData[`${idBase}_1`]?.val || "");
                updateCellInUI(`${idBase}_2`, cachedData[`${idBase}_2`]?.val || "");
            });
        }
        function initTheme() {
            if (localStorage.getItem('groli_theme') === 'light') {
                document.body.classList.add('light-theme');
                document.getElementById('theme-icon').innerText = 'light_mode';
            }
        }
        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-theme');
            document.getElementById('theme-icon').innerText = isLight ? 'light_mode' : 'dark_mode';
            localStorage.setItem('groli_theme', isLight ? 'light' : 'dark');
        }
        function checkUrlForToken() {
            const hash = window.location.hash;
            if (hash.includes("access_token=")) {
                const params = new URLSearchParams(hash.substring(1));
                const token = params.get("access_token");
                if (token) {
                    localStorage.setItem('mapSync_dcToken', token);
                    discordToken = token;
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
        }
        function initSocket() {
            socket = new WebSocket(BACKEND_URL.replace("http", "ws") + `?token=${discordToken}`);
            socket.onopen = () => {
                document.getElementById('status-indicator').innerText = "POŁĄCZONY";
                document.getElementById('status-indicator').className = "text-[10px] font-bold text-[#23a559]";
            };
            socket.onmessage = (event) => {
                const msg = JSON.parse(event.data);

                if (msg.type === 'auth_error') {
                    localStorage.removeItem('mapSync_dcToken');
                    discordToken = null;
                    showLogin();
                    return;
                }
                if (msg.type === 'init_data') {
                    cachedData = msg.data || {};
                    renderStructure(sections);
                } else if (msg.type === 'cell_updated') {
                    cachedData[msg.id] = { val: msg.val, ts: msg.ts };
                    updateCellInUI(msg.id, msg.val);
                }
            };
            socket.onclose = () => setTimeout(initSocket, 5000);
        }
        function updateCellInUI(id, val) {
            const cell = document.getElementById(`cell-${id}`);
            if (cell) {
                cell.innerText = val ? val : "---";
                cell.className = val ? "dc-chip active" : "dc-chip";
            }
        }
        function updateTimers() {
            const now = Date.now();
            const filterActive = document.getElementById('global-filter')?.checked;
            const sortActive = document.getElementById('sort-toggle')?.checked;
            sections.forEach(sec => {
                const grid = document.getElementById(`grid-${sec.id}`);
                if (!grid) return;
                const rowsInCol = [];
                sec.maps.forEach((_, i) => {
                    const idBase = `${sec.id}${i}`;
                    const ts1 = cachedData[`${idBase}_1`]?.ts || 0;
                    const ts2 = cachedData[`${idBase}_2`]?.ts || 0;
                    const lastTs = Math.max(ts1, ts2);
                    const timerEl = document.getElementById(`timer-${idBase}_1-${idBase}_2`);
                    const rowEl = document.getElementById(`row-${idBase}`);
                    if (timerEl && rowEl) {
                        const diff = lastTs > 0 ? (now - lastTs) / 1000 : 9999999;
                        rowEl.dataset.ts = lastTs; 
                        if (lastTs > 0) {
                            const mins = Math.floor(diff / 60), secs = Math.floor(diff % 60).toString().padStart(2, '0');
                            timerEl.innerText = `${mins}:${secs}`;
                            rowEl.classList.remove('row-fresh', 'row-warning', 'row-danger');
                            if (diff < 90) { rowEl.classList.add('row-fresh'); timerEl.style.color = "var(--dc-green)"; }
                            else if (diff < 180) { rowEl.classList.add('row-warning'); timerEl.style.color = "var(--dc-yellow)"; }
                            else { rowEl.classList.add('row-danger'); timerEl.style.color = "var(--dc-red)"; }
                        } else {
                            timerEl.innerText = "BRAK";
                            timerEl.style.color = "var(--dc-text-muted)";
                            rowEl.classList.remove('row-fresh', 'row-warning', 'row-danger');
                        }
                        if (filterActive && diff < 180 && lastTs > 0) rowEl.classList.add('hide-row');
                        else rowEl.classList.remove('hide-row');
                        rowsInCol.push(rowEl);
                    }
                });
                const seps = grid.querySelectorAll('.group-separator');

                if (sortActive) {
                    seps.forEach(s => s.style.display = 'none');
                    rowsInCol.sort((a, b) => parseInt(a.dataset.ts) - parseInt(b.dataset.ts));
                    rowsInCol.forEach(row => grid.appendChild(row));
                } else if (filterActive) {
                    seps.forEach(s => s.style.display = 'none');
                    rowsInCol.sort((a, b) => parseInt(a.dataset.originalIndex) - parseInt(b.dataset.originalIndex));
                    rowsInCol.forEach(row => grid.appendChild(row));
                } else {
                    seps.forEach(s => s.style.display = 'block');
                }
            });
        }
        window.onload = init;
    </script>
</body>
</html>
